<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escáner de Facturas QR</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:18px;background:#f3f6fa;color:#12213b;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:560px;margin:auto}.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 3px 15px #182a4415}h1{font-size:23px;margin:0 0 8px}h3{margin-bottom:8px}.muted{color:#5c6a7c;font-size:14px}button{width:100%;border:0;border-radius:10px;padding:13px 16px;font-size:16px;font-weight:600;background:#153b70;color:white;margin-top:12px;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#e5ebf3;color:#153b70}#reader{width:100%;margin-top:14px;overflow:hidden;border-radius:12px}#reader video{width:100%!important}label{display:block;font-size:12px;color:#617187;margin:12px 0 4px}input,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;background:#f8fafc}textarea{min-height:86px;resize:vertical}#fields{display:none}#status{white-space:pre-wrap;margin-top:14px;font-size:14px;overflow-wrap:anywhere}.success{color:#146c3b}.error{color:#aa2636}.pill{display:inline-block;background:#e5ebf3;border-radius:30px;padding:6px 12px;font-size:13px;color:#334155}#debug{display:none;margin-top:12px;padding:10px;background:#f1f5f9;border-radius:8px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}#file{margin-top:10px}
  </style>
</head>
<body>
  <main class="wrap"><section class="card">
    <h1>Escáner de Facturas QR</h1>
    <p class="muted">Escanea el QR de una factura electrónica peruana.</p>
    <span class="pill">Versión 3 · Prueba de lectura · No guarda facturas</span>
    <button id="start" type="button">📷 Abrir cámara</button>
    <button id="stop" class="secondary" type="button" hidden>Cerrar cámara</button>
    <div id="reader"></div>
    <p class="muted">También puedes seleccionar una fotografía del QR:</p>
    <input type="file" id="file" accept="image/*">
    <p class="muted">O pegar el texto del QR:</p>
    <textarea id="raw" placeholder="20100049181|01|F533|0475238|7.66|50.20|2026-10-10|6|20616651928"></textarea>
    <button id="interpret" class="secondary" type="button">Interpretar texto</button>
    <div id="fields"><h3>Datos reconocidos</h3><div id="grid"></div></div>
    <div id="status" aria-live="polite"></div>
    <div id="debug"></div>
  </section></main>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    'use strict';
    const el = id => document.getElementById(id);
    const names = ['RUC emisor','Tipo de comprobante','Serie','Número de factura','IGV','Importe total','Fecha de emisión','Tipo documento receptor','RUC receptor'];
    let scanner = null;
    let active = false;
    let processing = false;

    function report(message, good = false) {
      el('status').textContent = message;
      el('status').className = good ? 'success' : 'error';
    }
    function errorText(error) {
      if (typeof error === 'string') return error;
      return error?.message || String(error);
    }
    function interpret(raw) {
      // No se eliminan los guiones de la fecha; solo caracteres de control y espacios.
      const original = String(raw ?? '');
      const limpio = original.replace(/[\r\n\u2028\u2029\u200B\uFEFF]/g, '').trim();
      const parts = limpio.split('|').map(x => x.trim());
      el('fields').style.display = 'none';
      el('debug').style.display = 'none';
      if (parts.length !== 9) {
        report('El QR contiene ' + parts.length + ' campos; se esperaban 9.');
        el('debug').textContent = 'Texto leído (JSON): ' + JSON.stringify(original) + '\nSeparadores | encontrados: ' + (parts.length - 1) + '\nTexto normalizado: ' + JSON.stringify(limpio);
        el('debug').style.display = 'block';
        el('raw').value = original;
        return;
      }
      if (!/^\d{11}$/.test(parts[0]) || !/^\d{11}$/.test(parts[8])) {
        report('El QR contiene 9 campos, pero uno de los RUC no tiene 11 dígitos.');
        el('debug').textContent = JSON.stringify(parts, null, 2);
        el('debug').style.display = 'block';
        return;
      }
      const grid = el('grid');
      grid.replaceChildren();
      parts.forEach((value, index) => {
        const label = document.createElement('label');
        label.textContent = names[index];
        const input = document.createElement('input');
        input.type = 'text';
        input.value = value;
        input.readOnly = true;
        grid.append(label, input);
      });
      el('raw').value = parts.join('|');
      el('fields').style.display = 'block';
      report('QR reconocido correctamente: 9 campos.', true);
    }
    async function stop() {
      if (scanner) {
        if (active) { try { await scanner.stop(); } catch (e) {} }
        try { scanner.clear(); } catch (e) {}
        scanner = null;
      }
      active = false;
      el('start').hidden = false;
      el('stop').hidden = true;
    }
    el('start').addEventListener('click', async () => {
      if (typeof Html5Qrcode === 'undefined') {
        report('No se cargó la librería QR. Revisa tu conexión a Internet.');
        return;
      }
      el('start').disabled = true;
      try {
        scanner = new Html5Qrcode('reader', { verbose: false });
        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: (w,h) => { const side = Math.max(140, Math.min(260, Math.floor(Math.min(w,h)*.75))); return {width:side,height:side}; } },
          async decoded => {
            if (processing) return;
            processing = true;
            // Mostrar primero el resultado, sin ventanas alert que bloqueen el lector.
            interpret(decoded);
            await stop();
            processing = false;
          },
          () => {}
        );
        active = true;
        el('start').hidden = true;
        el('stop').hidden = false;
        report('Cámara abierta. Apunta al QR.', true);
      } catch (e) {
        const detail = errorText(e);
        await stop();
        report('No se pudo abrir la cámara: ' + detail);
      } finally {
        el('start').disabled = false;
      }
    });
    el('stop').addEventListener('click', stop);
    el('interpret').addEventListener('click', () => interpret(el('raw').value));
    el('file').addEventListener('change', async event => {
      const file = event.target.files?.[0];
      if (!file) return;
      if (typeof Html5Qrcode === 'undefined') { report('No se cargó la librería QR.'); return; }
      await stop();
      const photoReader = new Html5Qrcode('reader', {verbose:false});
      try {
        report('Leyendo fotografía...', true);
        const decoded = await photoReader.scanFile(file, true);
        interpret(decoded);
      } catch (e) {
        report('No se pudo leer el QR de la fotografía: ' + errorText(e));
      } finally {
        try { photoReader.clear(); } catch (e) {}
        el('file').value = '';
      }
    });
  </script>
</body>
</html>
